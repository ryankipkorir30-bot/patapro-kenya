<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | PataPro Kenya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg,#07111f,#0b1f36,#062b2b);
    }
    .card {
      width: 100%; max-width: 460px; padding: 34px;
      border: 1px solid #ffffff20; border-radius: 22px;
      background: #ffffff0d; box-shadow: 0 20px 60px #0006;
    }
    h1 { margin-top: 0; }
    p { color: #b7c5d5; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid #ffffff25; background: #ffffff0b;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 14px;
      border: 0; border-radius: 10px; cursor: pointer;
      font-size: 16px; font-weight: bold;
      background: linear-gradient(135deg,#00e0a4,#00a8ff);
    }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #00e0a4; text-decoration: none; }
    .message { display: none; padding: 12px; border-radius: 8px; }
    .message.show { display: block; background: #ffffff12; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters. Your reset link can only be used once.</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password"
             minlength="8" required>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password"
             minlength="8" required>

      <button id="submitButton" type="submit">Reset password</button>
    </form>

    <p><a href="login.html">← Back to login</a></p>
  </main>

  <script>
    const API_BASE = "/api";
    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
      showMessage("This reset link is missing or invalid. Request a new link.");
      button.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmation) {
        showMessage("The passwords do not match.");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating password...";

      try {
        const response = await fetch(`${API_BASE}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to reset password.");
        }

        form.reset();
        showMessage("Password reset successfully. Redirecting to login...");
        button.textContent = "Password updated";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);
      } catch (error) {
        showMessage(error.message || "Unable to reset password.");
        button.disabled = false;
        button.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
