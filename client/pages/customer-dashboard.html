<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/api-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Requests | PataPro Kenya</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .brand {
      color: inherit;
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      padding: 12px 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg,#00c6ff,#0072ff);
    }

    .btn-secondary {
      color: inherit;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .btn-danger {
      color: white;
      background: #dc2626;
    }

    .welcome {
      padding: 30px;
      border-radius: 22px;
      background: linear-gradient(
        135deg,
        rgba(0,198,255,.15),
        rgba(0,114,255,.08)
      );
      border: 1px solid rgba(0,198,255,.2);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 8px;
    }

    .welcome p {
      margin: 0;
      opacity: .7;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      padding: 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
    }

    .stat-label {
      opacity: .65;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      margin-top: 7px;
    }

    .card {
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    .card h2 {
      margin-top: 0;
    }

    .quote {
      padding: 22px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      margin-bottom: 15px;
    }

    .quote:last-child {
      margin-bottom: 0;
    }

    .quote-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .quote h3 {
      margin: 0 0 7px;
    }

    .business-name {
      opacity: .7;
      font-size: 14px;
    }

    .quote-message {
      line-height: 1.6;
      opacity: .8;
    }

    .status {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
      background: rgba(0,198,255,.12);
      color: #38bdf8;
    }

    .status.accepted {
      background: rgba(34,197,94,.15);
      color: #4ade80;
    }

    .status.rejected,
    .status.cancelled {
      background: rgba(239,68,68,.15);
      color: #f87171;
    }

    .status.completed {
      background: rgba(168,85,247,.15);
      color: #c084fc;
    }

    .quote-footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
      opacity: .75;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      opacity: .65;
    }

    .loading {
      text-align: center;
      padding: 40px;
      opacity: .6;
    }

    .error {
      color: #f87171;
    }

    @media(max-width: 600px) {
      .dashboard {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>

<div class="dashboard">

  <div class="topbar">

    <a
      href="../index.html"
      class="brand"
    >
      PataPro Kenya 🇰🇪
    </a>

    <div class="top-actions">

      <a
        href="../index.html"
        class="btn btn-primary"
      >
        Find Businesses
      </a>

      <button
        id="logoutBtn"
        class="btn btn-danger"
      >
        Logout
      </button>

    </div>

  </div>


  <section class="welcome">

    <h1>
      Hello, <span id="customerName">Customer</span> 👋
    </h1>

    <p>
      Track your quote requests and see responses from businesses.
    </p>

  </section>


  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Requests
      </div>

      <div
        id="totalQuotes"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Pending
      </div>

      <div
        id="pendingQuotes"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Responded
      </div>

      <div
        id="respondedQuotes"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Completed
      </div>

      <div
        id="completedQuotes"
        class="stat-number"
      >
        0
      </div>

    </div>

  </section>


  <section class="card">

    <h2>
      📩 My Quote Requests
    </h2>

    <div id="quotesList">

      <div class="loading">
        Loading your requests...
      </div>

    </div>

  </section>

</div>


<script>

const API_URL = window.PATAPRO_API_BASE || "/api";

const token =
  localStorage.getItem("patapro_token");

const user =
  JSON.parse(
    localStorage.getItem("patapro_user") || "null"
  );


/* -----------------------------
   AUTH
----------------------------- */

if (!token) {

  window.location.href =
    "login.html?redirect=customer-dashboard.html";

}


if (user) {

  const name =
    user.name ||
    `${user.first_name || ""} ${user.last_name || ""}`.trim() ||
    "Customer";

  document.getElementById(
    "customerName"
  ).textContent = name;

}


/* -----------------------------
   API
----------------------------- */

async function apiRequest(url) {

  const response =
    await fetch(
      `${API_URL}${url}`,
      {
        headers: {
          "Authorization":
            `Bearer ${token}`
        }
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    if (response.status === 401) {

      localStorage.removeItem(
        "patapro_token"
      );

      localStorage.removeItem(
        "patapro_user"
      );

      window.location.href =
        "login.html";

      return;

    }

    throw new Error(
      data.message ||
      "Request failed."
    );

  }


  return data;

}


/* -----------------------------
   ESCAPE HTML
----------------------------- */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* -----------------------------
   FORMAT DATE
----------------------------- */

function formatDate(date) {

  if (!date) {
    return "Unknown date";
  }

  return new Date(date)
    .toLocaleString(
      "en-KE",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

}


/* -----------------------------
   LOAD QUOTES
----------------------------- */

async function loadQuotes() {

  const list =
    document.getElementById(
      "quotesList"
    );


  try {

    const data =
      await apiRequest(
        "/quotes/my"
      );


    const quotes =
      data.quotes || [];


    updateStats(quotes);


    if (!quotes.length) {

      list.innerHTML = `

        <div class="empty">

          <h3>
            You haven't requested a quote yet.
          </h3>

          <p>
            Find a business and send your first request.
          </p>

          <a
            href="../index.html"
            class="btn btn-primary"
          >
            Find Businesses
          </a>

        </div>

      `;

      return;

    }


    list.innerHTML = "";


    quotes.forEach(
      quote => {

        list.appendChild(
          createQuoteCard(
            quote
          )
        );

      }
    );


  } catch (error) {

    console.error(error);

    list.innerHTML = `

      <div class="empty error">

        <h3>
          Unable to load quote requests
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* -----------------------------
   STATS
----------------------------- */

function updateStats(
  quotes
) {

  document.getElementById(
    "totalQuotes"
  ).textContent =
    quotes.length;


  document.getElementById(
    "pendingQuotes"
  ).textContent =
    quotes.filter(
      quote =>
        quote.status === "pending"
    ).length;


  document.getElementById(
    "respondedQuotes"
  ).textContent =
    quotes.filter(
      quote =>
        quote.status === "responded"
    ).length;


  document.getElementById(
    "completedQuotes"
  ).textContent =
    quotes.filter(
      quote =>
        quote.status === "completed"
    ).length;

}


/* -----------------------------
   QUOTE CARD
----------------------------- */

function createQuoteCard(
  quote
) {

  const card =
    document.createElement("article");

  card.className =
    "quote";


  const status =
    String(
      quote.status || "pending"
    ).toLowerCase();


  const businessId =
    quote.business_id;


  const businessName =
    quote.business_name ||
    "Business";


  card.innerHTML = `

    <div class="quote-header">

      <div>

        <h3>
          ${escapeHTML(
            quote.subject
          )}
        </h3>

        <div class="business-name">
          🏢 ${escapeHTML(
            businessName
          )}
        </div>

      </div>


      <span
        class="status ${escapeHTML(status)}"
      >
        ${escapeHTML(status)}
      </span>

    </div>


    <p class="quote-message">

      ${escapeHTML(
        quote.message
      )}

    </p>


    ${
      quote.service_name

        ? `
          <p>
            🛠 <strong>Service:</strong>
            ${escapeHTML(
              quote.service_name
            )}
          </p>
        `

        : ""
    }


    ${
      quote.budget

        ? `
          <p>
            💰 <strong>Budget:</strong>
            KES ${Number(
              quote.budget
            ).toLocaleString("en-KE")}
          </p>
        `

        : ""
    }


    <div class="quote-footer">

      <span>
        📅 ${formatDate(
          quote.created_at
        )}
      </span>


      ${
        businessId

          ? `
            <a
              href="business.html?id=${businessId}"
              class="btn btn-secondary"
            >
              View Business
            </a>
          `

          : ""
      }

    </div>

  `;


  return card;

}


/* -----------------------------
   LOGOUT
----------------------------- */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      "patapro_token"
    );

    localStorage.removeItem(
      "patapro_user"
    );

    window.location.href =
      "login.html";

  }
);


/* -----------------------------
   START
----------------------------- */

loadQuotes();

</script>
<script src="/js/app.js"></script>
</body>
</html>
