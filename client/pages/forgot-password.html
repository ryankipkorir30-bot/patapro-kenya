<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | PataPro Kenya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg,#07111f,#0b1f36,#062b2b);
    }
    .card {
      width: 100%; max-width: 460px; padding: 34px;
      border: 1px solid #ffffff20; border-radius: 22px;
      background: #ffffff0d; box-shadow: 0 20px 60px #0006;
    }
    h1 { margin-top: 0; }
    p { color: #b7c5d5; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid #ffffff25; background: #ffffff0b;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 18px; padding: 14px;
      border: 0; border-radius: 10px; cursor: pointer;
      font-size: 16px; font-weight: bold;
      background: linear-gradient(135deg,#00e0a4,#00a8ff);
    }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #00e0a4; text-decoration: none; }
    .message { display: none; padding: 12px; border-radius: 8px; }
    .message.show { display: block; background: #ffffff12; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Forgot your password?</h1>
    <p>Enter the email address you used to register. If an account exists,
       we'll send you a secure password reset link.</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="forgotForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" placeholder="you@example.com" required>
      <button id="submitButton" type="submit">Send reset link</button>
    </form>

    <p><a href="login.html">← Back to login</a></p>
  </main>

  <script>
    const API_BASE = "/api";
    const form = document.getElementById("forgotForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Sending...";

      try {
        const response = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to send the request.");
        }

        showMessage(data.message ||
          "If an account exists for that email, a reset link will be sent.");
        form.reset();
      } catch (error) {
        showMessage(error.message ||
          "Unable to contact PataPro. Check that the server is running.");
      } finally {
        button.disabled = false;
        button.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
